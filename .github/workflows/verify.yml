name: Riverbraid Verification Suite
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Riverbraid-Core
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
      - name: Byte audit regression cases
        run: node --test tests/byte-audit.test.mjs
      - name: Clone Ring 0 sibling repositories
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          for repo in \
            Riverbraid-Golds \
            Riverbraid-Governance \
            Riverbraid-Integrity-Floors \
            Riverbraid-Types
          do
            echo "Cloning $repo"
            git clone --depth 1 "https://github.com/Riverbraid/${repo}.git" "$repo"
          done
          echo "RING0_SIBLINGS_CLONED"
      - name: Run compatibility audit
        shell: bash
        run: |
          set -euo pipefail
          node audit_final.js
          node constellation-audit.mjs --ring 0
      - name: Clone Ring 2 sibling repositories
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          for repo in \
            Riverbraid-RDK \
            Riverbraid-Gold-UI \
            Riverbraid-Wasm-Bridge \
            riverbraid-tsh \
            Riverbraid-Lite \
            Riverbraid-Lang \
            Riverbraid-p5 \
            Riverbraid-Hydra
          do
            git clone --depth 1 "https://github.com/Riverbraid/${repo}.git" "$repo"
          done
      - name: Run Ring 2 coupling audit
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const {execFileSync}=require("node:child_process");const r=JSON.parse(execFileSync(process.execPath,["constellation-audit.mjs","--ring","2"],{encoding:"utf8"}));console.log(JSON.stringify(r));if(r.rings[0].gate_status!=="RING_GATE_PASS_VERIFIED")process.exit(1)'
          node byte-audit.mjs --ring 2
          node -e 'const a=require("./audit-output.json");console.log(JSON.stringify(a.repos.map(r=>({name:r.name,git_commit:r.git_commit,byte_status:r.byte_status}))))'
      - name: Final status
        run: echo "RIVERBRAID_CORE_RING0_AND_RING2_CI_OK"
